name: ✨ 功能建议 | Feature Request
description: 新技能 / 新功能 / 流程改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 建议内容 | What
      description: 想改进 arXiv TeX、XMU Beamer、编译或 PDF 检查中的哪个环节
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 使用场景 | Why
      description: 在论文讲解 PDF 制作的什么场景下需要它，解决了什么问题
    validations:
      required: true
  - type: textarea
    id: ref
    attributes:
      label: 参考实现 | References (optional)
      description: 相关技能 / 仓库 / 链接
