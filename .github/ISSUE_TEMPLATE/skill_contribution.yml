---
name: 🔀 技能贡献 | Skill Contribution
description: 提交新技能 / 修改现有技能
title: "[Skill] "
labels: ["skill"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 [CONTRIBUTING.md](../../CONTRIBUTING.md)：本 Fork 仅接受 arXiv TeX → XMU Beamer → PDF 范围内的技能改进。
  - type: input
    id: skill
    attributes:
      label: 技能目录 | Skill name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 改动说明 | Change
      description: 新增/修改了什么，行为变化与验证结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单 | Checklist
      options:
        - label: grep 检查无个人路径、凭据或旧品牌残留
          required: true
        - label: 所有 Python 脚本通过 py_compile
          required: true
        - label: 无 .venv / Cookie / 编译缓存混入
          required: true
